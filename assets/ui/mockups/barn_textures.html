<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
body { margin: 0; padding: 16px; background: #6b8f5a; font-family: 'Fredoka One', sans-serif; }
.g { color: #fff8e4; -webkit-text-stroke: 0.24em #2b1a0e; paint-order: stroke fill; text-shadow: 0 0.09em 0 #2b1a0e; }
.frame { width: 360px; padding: 16px; border: 5px solid #3a2210; border-radius: 22px; background: url(../export/ui_planks.png) 0 0 / 256px 256px; }
.head { border: 3px solid #2b1a0e; border-radius: 12px; text-align: center; font-size: 28px; padding: 6px 0; background: url(../export/ui_stripes.png) 0 0 / 64px 64px, linear-gradient(#ffc34d, #f08a24); background-blend-mode: soft-light, normal; margin-bottom: 10px; }
.card { border: 3px solid #2b1a0e; border-radius: 12px; padding: 10px; background: url(../export/ui_dots.png) 0 0 / 12px 12px, linear-gradient(135deg, #ffd25a, #f39a2c); display: flex; align-items: center; gap: 10px; }
.ic { display: inline-block; width: 64px; height: 64px; background: url(../export/ui_icons.png) 0 0 / 512px 512px no-repeat; }
</style>
</head>
<body>
<div class="frame">
  <div class="head"><span class="g">Feathers</span></div>
  <div class="card">
    <span class="ic" style="background-position: -448px -128px"></span>
    <div class="g" style="font-size: 22px">Wood, stripes and dots</div>
  </div>
  <div style="margin-top: 10px; display: flex; gap: 6px;">
    <span class="ic" style="background-position: -448px -128px; display:none"></span>
    <span class="ic" style="background-position: -448px -128px"></span>
  </div>
</div>
<script>
  const cells = [[7,2],[0,3],[1,3],[2,3],[3,3],[4,3],[4,1]];
  const row = document.querySelector('.frame > div:last-child');
  row.innerHTML = cells.map(([x, y]) => `<span class="ic" style="background-position:${-x*64}px ${-y*64}px"></span>`).join('');
</script>
</body>
</html>
