<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shop options</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #6b8f5a; font-family: 'Fredoka One', sans-serif; padding: 18px; }
.row { display: flex; gap: 22px; align-items: flex-start; }
.opt { width: 330px; }
.label { color: #fff; font-size: 22px; text-align: center; margin-bottom: 8px; -webkit-text-stroke: 5px #2b1a0e; paint-order: stroke fill; }
.frame { position: relative; border-radius: 22px; padding: 46px 12px 12px; }
.plaque { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); padding: 6px 34px; border-radius: 12px; font-size: 30px; }
.deco { position: absolute; font-size: 30px; }
.t { color: #fff; -webkit-text-stroke: 5px #2b1a0e; paint-order: stroke fill; }
.g { color: #fff8e4; -webkit-text-stroke: 0.24em #2b1a0e; paint-order: stroke fill; text-shadow: 0 0.09em 0 #2b1a0e; }
.box { position: relative; border: 3px solid #2b1a0e; border-radius: 12px; margin-top: 9px; overflow: visible; }
.dots { background-image: radial-gradient(rgba(255,255,255,.28) 1.6px, transparent 1.8px); background-size: 9px 9px; }
.stripes { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 13px, transparent 13px 26px); }
.head { text-align: center; font-size: 27px; padding: 6px 0 4px; }
.ic { display: inline-block; width: 64px; height: 64px; background: url(../export/ui_icons.png) 0 0 / 512px 512px no-repeat; }
.btn { display: inline-block; font-size: 15px; padding: 4px 12px; border: 3px solid #1d4d14; border-radius: 9px; background: linear-gradient(#86e25e, #3ca52c); color: #fff; -webkit-text-stroke: 3.5px #1d4d14; paint-order: stroke fill; }
.tag { position: absolute; font-size: 14px; padding: 2px 8px; border: 3px solid #2b1a0e; border-radius: 8px; transform: rotate(8deg); }
.small { font-size: 12px; }
.flex { display: flex; align-items: center; }
.cards3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 9px; }
.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; }
.card { position: relative; border: 3px solid #2b1a0e; border-radius: 12px; text-align: center; padding: 6px 4px 8px; }
s { text-decoration-thickness: 3px; text-decoration-color: #d62a1e; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const ICON = { feather:[0,0], ticket:[2,0], lightning:[4,0], crown:[5,0], gift:[6,0], star:[0,1], clock:[3,1], turkey:[4,1], tag:[5,1], fs:[6,1], fm:[7,1], fl:[0,2], pie:[2,2] };
const ic = (n, size) => { const [x, y] = ICON[n]; const s = size || 64; return `<span class="ic" style="width:${s}px;height:${s}px;background-size:${s*8}px ${s*8}px;background-position:${-x*s}px ${-y*s}px"></span>`; };

const themes = [
  {
    title: "A · Harvest barn",
    frame: "background: repeating-linear-gradient(0deg, #8a5a32 0 22px, #7a4c28 22px 24px), #8a5a32; border: 4px solid #3a2210;",
    plaque: "background: linear-gradient(#b07440, #7a4a22); border: 4px solid #3a2210;",
    decos: [["🎃", "left:-14px; top:-12px"], ["🍁", "right:-12px; top:-10px"], ["🌽", "left:-16px; top:46%"], ["🍂", "right:-14px; top:62%"], ["🎃", "right:-12px; bottom:-14px"]],
    banner: "linear-gradient(135deg, #f4a23c, #e0582a)",
    heads: { bundles: "linear-gradient(#ffc34d, #f08a24)", deal: "linear-gradient(#e2533e, #a8281c)", passes: "linear-gradient(#ffc34d, #f08a24)", feathers: "linear-gradient(#ffc34d, #f08a24)" },
    cards: { bundles: "linear-gradient(135deg, #ffd25a, #f39a2c)", deal: "linear-gradient(135deg, #f0705a, #b3362a)", passes: "linear-gradient(135deg, #ffd25a, #f39a2c)", feathers: "linear-gradient(135deg, #ffd25a, #f39a2c)" },
  },
  {
    title: "B · Pie and plaid",
    plaid: true,
    frame: "background: radial-gradient(circle at 12px 12px, #e9b86a 9px, transparent 10px) 0 0 / 24px 24px, linear-gradient(#d99a4e, #c0803a); border: 4px solid #6a3c16;",
    plaque: "background: linear-gradient(#fff3d6, #f2d49c); border: 4px solid #6a3c16; color: #fff;",
    decos: [["🥧", "left:-16px; top:-12px"], ["🍗", "right:-14px; top:-12px"], ["🍎", "left:-14px; top:55%"], ["🥧", "right:-14px; bottom:-14px"]],
    banner: "linear-gradient(135deg, #c8343c, #8e1f2c)",
    heads: { bundles: "repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), #c9353a", deal: "repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), #c9353a", passes: "repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), #c9353a", feathers: "repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), repeating-linear-gradient(0deg, rgba(255,255,255,.35) 0 12px, transparent 12px 24px), #c9353a" },
    cards: { bundles: "linear-gradient(135deg, #fff1d0, #f6c98a)", deal: "linear-gradient(135deg, #fff1d0, #f6c98a)", passes: "linear-gradient(135deg, #fff1d0, #f6c98a)", feathers: "linear-gradient(135deg, #fff1d0, #f6c98a)" },
  },
  {
    title: "C · Autumn stone",
    frame: "background: radial-gradient(circle at 30% 30%, #8d8a86 0 18px, transparent 19px) 0 0 / 44px 40px, radial-gradient(circle at 70% 75%, #77736f 0 16px, transparent 17px) 0 0 / 40px 44px, #6e6a66; border: 4px solid #2e2b29;",
    plaque: "background: linear-gradient(#9a9692, #6c6864); border: 4px solid #2e2b29;",
    decos: [["🍁", "left:-14px; top:-12px"], ["🌰", "right:-12px; top:-8px"], ["🍂", "left:-16px; top:40%"], ["🍁", "right:-14px; top:52%"], ["🌰", "left:-12px; bottom:-10px"]],
    banner: "linear-gradient(135deg, #a6d84a, #3f9a2a)",
    heads: { bundles: "linear-gradient(#ffb84a, #ee7a1e)", deal: "linear-gradient(#e2596a, #9e2440)", passes: "linear-gradient(#ffd04a, #f0a21e)", feathers: "linear-gradient(#ffd04a, #f0a21e)" },
    cards: { bundles: "linear-gradient(135deg, #ffc35a, #f07e24)", deal: "linear-gradient(135deg, #ee6c7c, #a82c48)", passes: "linear-gradient(135deg, #ffd65a, #f2a62a)", feathers: "linear-gradient(135deg, #ffd65a, #f2a62a)" },
  },
];

const DOTS = "radial-gradient(rgba(255,255,255,.28) 1.6px, transparent 1.8px) 0 0 / 9px 9px";
const STRIPES = "repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 13px, transparent 13px 26px)";
function column(th) {
  const dotted = (g) => `${DOTS}, ${g}`;
  for (const k in th.cards) th.cards[k] = dotted(th.cards[k]);
  th.banner = dotted(th.banner);
  const head = (k, text) => `<div class="box head" style="background:${th.plaid ? th.heads[k] : STRIPES + ", " + th.heads[k]};"><span class="g">${text}</span></div>`;
  const decos = th.decos.map(([e, pos]) => `<span class="deco" style="${pos}">${e}</span>`).join("");
  return `
  <div class="opt">
    <div class="label">${th.title}</div>
    <div class="frame" style="${th.frame}">
      ${decos}
      <div class="plaque" style="${th.plaque}"><span class="g">SHOP</span></div>

      <div class="box dots flex" style="background-color:transparent; background:${th.banner}; padding:8px 10px; gap:8px;">
        ${ic("fl", 66)}
        <div style="flex:1; text-align:center;">
          <div class="g" style="font-size:18px;">Feast Frenzy!</div>
          <div class="g" style="font-size:24px;">1x &rarr; 2x</div>
          <div class="g" style="font-size:12px;">Feathers for the whole server, 15 min!</div>
        </div>
        <span class="btn">R$ 99</span>
      </div>

      ${head("bundles", "Bundles!")}
      <div class="box dots" style="background:${th.cards.bundles}; padding:8px 10px;">
        <span class="tag g" style="right:-8px; top:-12px; background:#e0372a;">NEW!</span>
        <div class="g" style="font-size:16px;">Harvest Bundle</div>
        <div class="flex" style="justify-content:space-between; margin-top:4px;">
          <div class="flex" style="gap:2px;">
            <div style="text-align:center">${ic("turkey", 48)}<div class="g small">Skin</div></div>
            <span class="g" style="font-size:18px">+</span>
            <div style="text-align:center">${ic("fm", 48)}<div class="g small">1,000</div></div>
            <span class="g" style="font-size:18px">+</span>
            <div style="text-align:center">${ic("gift", 48)}<div class="g small">5 starts</div></div>
          </div>
          <div style="text-align:center"><div class="g small"><s>R$ 349</s></div><span class="btn">R$ 199</span></div>
        </div>
      </div>

      ${head("deal", "Skin of the Day")}
      <div class="box dots flex" style="background:${th.cards.deal}; padding:8px 10px; gap:8px;">
        <span class="tag g" style="right:-8px; top:-12px; background:#e0372a;">-20%</span>
        ${ic("turkey", 72)}
        <div style="flex:1">
          <div class="g" style="font-size:18px;">Golden Turkey</div>
          <div class="g small">New deal in 5:12:40</div>
        </div>
        <div style="text-align:center"><div class="g small"><s>1,000</s></div><span class="btn" style="background:linear-gradient(#ffcf5a,#f0961e); border-color:#6a3a0c; -webkit-text-stroke-color:#6a3a0c;">800</span></div>
      </div>

      ${head("passes", "Game Passes")}
      <div class="cards2">
        <div class="card dots" style="background:${th.cards.passes}">${ic("crown", 56)}<div class="g" style="font-size:17px">VIP</div><div class="g small">2x Feathers, VIP tag, gold trail</div><div style="margin-top:5px"><span class="btn">R$ 299</span></div></div>
        <div class="card dots" style="background:${th.cards.passes}">${ic("ticket", 56)}<div class="g" style="font-size:17px">Premium</div><div class="g small">Exclusive skins and rewards</div><div style="margin-top:5px"><span class="btn">R$ 199</span></div></div>
      </div>

      ${head("feathers", "Feathers")}
      <div class="cards3">
        <div class="card dots" style="background:${th.cards.feathers}"><div class="g" style="font-size:15px">300</div>${ic("fs", 52)}<div><span class="btn" style="font-size:13px; padding:3px 8px">R$ 25</span></div></div>
        <div class="card dots" style="background:${th.cards.feathers}"><div class="g" style="font-size:15px">1,000</div>${ic("fm", 52)}<div class="g small">Popular!</div><div><span class="btn" style="font-size:13px; padding:3px 8px">R$ 75</span></div></div>
        <div class="card dots" style="background:${th.cards.feathers}"><div class="g" style="font-size:15px">3,000</div><div class="g small">+500 bonus!</div>${ic("fl", 46)}<div class="g small">Best deal!</div><div><span class="btn" style="font-size:13px; padding:3px 8px">R$ 199</span></div></div>
      </div>
    </div>
  </div>`;
}
document.getElementById("row").innerHTML = themes.map(column).join("");
</script>
</body>
</html>
